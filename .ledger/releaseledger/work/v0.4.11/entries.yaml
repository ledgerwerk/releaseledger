  - kind: added
    summary:
      "Added `repair index` to rebind, rebuild, or quarantine the disposable
      indexes cache"
    body: "The command inspects the generated indexes cache and applies explicit
      actions: rebind-and-rebuild for generated or legacy caches, quarantine-and-rebuild
      for foreign caches behind --quarantine-foreign, and a blocked action when neither
      is authorized. Records are never modified."
    status: accepted
