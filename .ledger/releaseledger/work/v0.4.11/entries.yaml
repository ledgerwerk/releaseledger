    summary:
      "Changed `status`, `storage where`, and `storage validate` to report
      storage validity and repair guidance"
    body:
      "Storage diagnostics now distinguish raw layout validity from effective
      validity of the disposable indexes cache, list unexpected cache paths with
      portable POSIX separators, show the indexes binding classification, and print
      the matching repair command. `migrate status` additionally prints remediation
      guidance."
