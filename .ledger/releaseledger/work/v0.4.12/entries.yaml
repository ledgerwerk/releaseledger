    prs: []
    issues: []
    contributors:
      - "@holgern"
  - kind: fixed
    summary: "Fixed release reconciliation to validate changelog dates against persisted release dates rather than tag target dates"
    body: >-
      A tag pointing to a commit with a different target date no longer causes a
      changelog mismatch. Reconciliation still requires a released section's
      heading date to match the persisted release date.
    status: accepted
    internal: false
    breaking: false
