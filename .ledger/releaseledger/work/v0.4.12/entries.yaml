entries:
  - kind: changed
    summary: "Changed strict public builds to accept complete internal or rejected audit decisions as commit coverage"
    body: >-
      Strict public changelog builds can now account for commits with complete,
      current internal or rejected audit decisions without requiring public
      entries. Incomplete or stale decisions remain uncovered, and internal-
      inclusive builds still require an entry for internal commits. Release
      review uses the same evidence-completeness rule.
    status: accepted
    internal: false
    breaking: false
    source_refs:
      - git:5e107b15e7df9f27c960d0ee2d50029faa6497ad
    paths:
      - releaseledger/services/audit.py
